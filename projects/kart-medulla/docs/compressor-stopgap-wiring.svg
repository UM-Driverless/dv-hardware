<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#111">EBS compressor — stopgap wiring via HA210N06 module</text>
  <text x="500" y="60" text-anchor="middle" font-size="14" fill="#666">Board unchanged. Old external MOSFET removed. The 8 A never touches the medulla.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- ================= 12V REGULATOR ================= -->
  <rect x="90" y="95" width="330" height="70" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="255" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">12 V REGULATOR</text>
  <text x="255" y="148" text-anchor="middle" font-size="12" fill="#a33">short, thick wires — straight back here</text>
  <text x="152" y="186" font-size="13" font-weight="bold" fill="#c0392b">+12 V</text>
  <text x="358" y="186" font-size="13" font-weight="bold" fill="#c0392b">GND</text>

  <!-- ================= LEGEND ================= -->
  <line x1="620" y1="112" x2="678" y2="112" stroke="#c0392b" stroke-width="5"/>
  <text x="690" y="117" font-size="13" fill="#333">power loop — ~8 A</text>
  <line x1="620" y1="142" x2="678" y2="142" stroke="#2563eb" stroke-width="2.5"/>
  <text x="690" y="147" font-size="13" fill="#333">signal — µA</text>
  <text x="620" y="176" font-size="12" fill="#777">Gated on the 3.3 V gate-to-source test.</text>

  <!-- ================= MODULE ================= -->
  <rect x="90" y="250" width="440" height="230" rx="6" fill="#f7f9fc" stroke="#333" stroke-width="2.5"/>

  <rect x="118" y="258" width="95" height="34" rx="4" fill="#fff" stroke="#c0392b" stroke-width="1.8"/>
  <text x="165" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">DC IN +</text>
  <rect x="298" y="258" width="95" height="34" rx="4" fill="#fff" stroke="#c0392b" stroke-width="1.8"/>
  <text x="345" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">DC IN −</text>

  <text x="255" y="330" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">HUABAN HA210N06</text>
  <text x="255" y="352" text-anchor="middle" font-size="13" fill="#555">low-side switch · 25 A · heatsinked</text>

  <rect x="415" y="370" width="100" height="34" rx="4" fill="#fff" stroke="#c0392b" stroke-width="1.8"/>
  <text x="465" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">HOT BED +</text>
  <rect x="415" y="425" width="100" height="34" rx="4" fill="#fff" stroke="#c0392b" stroke-width="1.8"/>
  <text x="465" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">HOT BED −</text>

  <!-- Control In: spans BOTH arrow landing points -->
  <rect x="128" y="422" width="245" height="46" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="250" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">Control In (2-pin JST)</text>
  <text x="178" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">sig</text>
  <text x="318" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">GND</text>

  <!-- ================= COMPRESSOR ================= -->
  <rect x="700" y="355" width="215" height="120" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="807" y="405" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">COMPRESSOR</text>
  <text x="807" y="428" text-anchor="middle" font-size="12" fill="#a33">~8 A · inductive</text>
  <text x="690" y="382" text-anchor="end" font-size="15" font-weight="bold" fill="#c0392b">+</text>
  <text x="690" y="452" text-anchor="end" font-size="15" font-weight="bold" fill="#c0392b">−</text>

  <!-- ================= MEDULLA ================= -->
  <rect x="90" y="580" width="440" height="150" rx="6" fill="#f2f7f2" stroke="#2f7d32" stroke-width="2.5"/>
  <text x="310" y="610" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f7d32">KART-MEDULLA PCB (v1, unchanged)</text>
  <rect x="118" y="628" width="120" height="36" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="178" y="651" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">CN8.2 "BUZZ"</text>
  <text x="178" y="684" text-anchor="middle" font-size="11" fill="#555">GPIO 3 · 3.3 V logic</text>
  <text x="178" y="701" text-anchor="middle" font-size="11" fill="#888">(old name — no buzzer)</text>
  <rect x="258" y="628" width="120" height="36" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="318" y="651" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">CN9.3 GND</text>
  <text x="318" y="684" text-anchor="middle" font-size="11" fill="#555">nearest GND to CN8</text>

  <!-- ================= POWER WIRING ================= -->
  <path d="M165,165 L165,258" stroke="#c0392b" stroke-width="5" fill="none"/>
  <path d="M345,165 L345,258" stroke="#c0392b" stroke-width="5" fill="none"/>
  <path d="M515,387 L700,387" stroke="#c0392b" stroke-width="5" fill="none"/>
  <path d="M515,442 L700,442" stroke="#c0392b" stroke-width="5" fill="none"/>

  <!-- flyback diode: cathode bar toward + (upper) -->
  <path d="M630,387 L630,442" stroke="#c0392b" stroke-width="3" fill="none"/>
  <polygon points="618,432 642,432 630,410" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="616" y1="410" x2="644" y2="410" stroke="#c0392b" stroke-width="3.5"/>
  <text x="606" y="404" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">flyback</text>
  <text x="606" y="420" text-anchor="end" font-size="11" fill="#c0392b">band → +</text>

  <!-- ================= SIGNAL WIRING ================= -->
  <path d="M178,628 L178,478" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M318,628 L318,478" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="192" y="550" font-size="12" font-weight="bold" fill="#2563eb">signal</text>
  <text x="332" y="550" font-size="12" font-weight="bold" fill="#2563eb">GND</text>

  <!-- ================= REMOVED ================= -->
  <rect x="700" y="580" width="215" height="150" rx="6" fill="#f6f6f6" stroke="#999" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="807" y="612" text-anchor="middle" font-size="14" font-weight="bold" fill="#777">REMOVED</text>
  <text x="807" y="638" text-anchor="middle" font-size="12" fill="#777">old external MOSFET</text>
  <text x="807" y="662" text-anchor="middle" font-size="11" fill="#777">Unplug its gate wire from</text>
  <text x="807" y="679" text-anchor="middle" font-size="11" fill="#777">CN8.2, and move the</text>
  <text x="807" y="696" text-anchor="middle" font-size="11" fill="#777">compressor − wire off</text>
  <text x="807" y="713" text-anchor="middle" font-size="11" fill="#777">its drain.</text>
</svg>
